name: Build extension
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Verify extension package contents
        run: |
          test -f dist/manifest.json
          test -f dist/index.html
          test -f dist/background.js
          test -f dist/icons/citymail-128.png
          node -e "const m=require('./dist/manifest.json'); if(m.manifest_version!==3) process.exit(1); for (const p of Object.values(m.icons||{})) { if (!require('fs').existsSync('dist/'+p)) throw new Error('Missing icon: '+p); }"
      - name: Create upload-ready extension ZIP
        run: |
          cd dist
          zip -r ../citymail-finder-v1.1.2.zip .
      - name: Upload extension ZIP
        uses: actions/upload-artifact@v4
        with:
          name: citymail-finder-v1.1.2
          path: citymail-finder-v1.1.2.zip
          if-no-files-found: error
          retention-days: 14
