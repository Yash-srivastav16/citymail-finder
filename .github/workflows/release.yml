name: Package extension release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build extension
        run: npm run build
      - name: Validate version and package
        shell: bash
        run: |
          VERSION="$(node -p "require('./dist/manifest.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match manifest version ($VERSION)"
            exit 1
          fi
          test -f dist/manifest.json
          test -f dist/index.html
          test -f dist/background.js
          test -f dist/icons/citymail-128.png
          node -e "const m=require('./dist/manifest.json'); if(m.manifest_version!==3) process.exit(1); for (const p of Object.values(m.icons||{})) { if (!require('fs').existsSync('dist/'+p)) throw new Error('Missing icon: '+p); }"
          mkdir -p release
          (cd dist && zip -r "../release/citymail-finder-v${VERSION}.zip" .)
          unzip -l "release/citymail-finder-v${VERSION}.zip"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Upload release package artifact
        uses: actions/upload-artifact@v4
        with:
          name: citymail-finder-v${{ env.VERSION }}-package
          path: release/citymail-finder-v${{ env.VERSION }}.zip
          if-no-files-found: error
          retention-days: 90
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/citymail-finder-v${{ env.VERSION }}.zip
